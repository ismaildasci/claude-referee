name: Runner or linter parser request
description: Output from a test runner or linter that evidence-referee should read in code (v0.2).
labels: [parser]
body:
  - type: input
    id: tool
    attributes:
      label: Tool and version
      placeholder: pytest 8.3, go test, PHPUnit 11 ...
    validations:
      required: true
  - type: textarea
    id: pass
    attributes:
      label: Output when everything passes
      render: text
    validations:
      required: true
  - type: textarea
    id: fail
    attributes:
      label: Output with at least one failure
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Flags or report formats worth supporting
      description: For example JUnit XML or a JSON reporter.
