name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed bundle and npm copy match the source
        run: git diff --exit-code plugins/claude-referee/dist npm

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20.3"
      - name: Bundle runs without node_modules on the oldest supported Node
        run: |
          tmp="$(mktemp -d)"
          cp -R plugins/claude-referee "$tmp/"
          cli="$tmp/claude-referee/dist/cli.mjs"
          for c in done decide judge verify receipts doctor eval; do
            node "$cli" "$c" --describe | node -e 'JSON.parse(require("fs").readFileSync(0, "utf8"))' || { echo "describe failed: $c"; exit 1; }
          done
          echo 'not json' | node "$tmp/claude-referee/dist/hook.mjs" session-start
          size=$(cat "$tmp"/claude-referee/dist/*.mjs | wc -c)
          echo "bundle bytes: $size"
          test "$size" -lt 200000
      - name: Recorded evals score within each suite's allowance (offline, no key)
        run: node plugins/claude-referee/dist/cli.mjs eval score --suite all --fail-on violated

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugins/claude-referee

  private-terms:
    runs-on: ubuntu-latest
    env:
      REFEREE_PRIVATE_TERMS: ${{ secrets.REFEREE_PRIVATE_TERMS }}
    steps:
      - uses: actions/checkout@v7
      - name: No private terms in the repository
        if: env.REFEREE_PRIVATE_TERMS != ''
        run: bash scripts/check-no-private.sh
