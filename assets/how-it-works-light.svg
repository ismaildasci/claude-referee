<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="referee-how-title referee-how-desc">
<title id="referee-how-title">How claude-referee works</title>
<desc id="referee-how-desc">Three columns. Claude Code session: SessionStart gives a short local briefing of at most 800 characters; from v0.2, Stop asks whether the work is really done and a model switch triggers a local cache guard; Claude can run the judge, decide, verify or done commands. Hook events and CLI calls go to claude-referee, which runs on your machine: 1 parse evidence in code (test runners, linters; from v0.2), 2 stop requests that contain secrets and redact personal data, 3 batch the pack's questions into one request. One batched request goes to the TypeSafe Jev API: 4 POST /v1/systemone with model jev-1.13.0; Noul, Choice and Score questions return probabilities; $0.042 per million input tokens, output free. Probabilities come back to claude-referee: 5 threshold the probabilities, giving one of three outcomes: silent, a note of at most 300 characters, or a compact JSON verdict, which go back to Claude. Each call leaves a receipt with model, request id, tokens, cost and latency, and no request text. Stays on your machine: receipts and the answer cache. Leaves your machine: questions and redacted input (US-hosted API).</desc>
<style>
.s{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
.t{fill:#1f2328}.t2{fill:#59636e}.ac{fill:#4a3aa7}
</style>
