"600">2</text><text x="470" y="250" class="s t" font-size="16">Stop secrets, redact personal data</text><circle cx="450.5" cy="288.5" r="10.5" fill="#eff2f5"/><text x="450.5" y="293" class="s t" text-anchor="middle" font-size="13" font-weight="600">3</text><text x="470" y="294" class="s t" font-size="16">Batch the pack's questions</text><text x="470" y="317" class="s t" font-size="16">into one request</text><circle cx="450.5" cy="362.5" r="10.5" fill="#eff2f5"/><text x="450.5" y="367" class="s t" text-anchor="middle" font-size="13" font-weight="600">5</text><text x="470" y="368" class="s t" font-size="16">Threshold the probabilities</text><rect class="box" x="470.5" y="384.5" width="53" height="27" rx="14" fill="#ffffff" stroke="#d1d9e0"/><text x="497" y="403" class="s t" text-anchor="middle" font-size="13.5">silent</text><rect class="box" x="530.5" y="384.5" width="128.07" height="27" rx="14" fill="#ffffff" stroke="#d1d9e0"/><text x="594.53" y="403" class="s t" text-anchor="middle" font-size="13.5">≤300-char note</text><rect class="box" x="665.57" y="384.5" width="110.05" height="27" rx="14" fill="#ffffff" stroke="#d1d9e0"/><text x="720.59" y="403" class="s t" text-anchor="middle" font-size="13.5">JSON verdict</text><rect class="box" x="440.5" y="434.5" width="377" height="53" rx="8" fill="#ffffff" stroke="#d1d9e0"/><path d="M456 449h12v16l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5-2 1.5z M459 454h6 M459 458h6" fill="none" stroke="#59636e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="484" y="456" class="s t2" font-size="14"><tspan class="t" font-weight="600">receipt:</tspan> model · request id · tokens</text><text x="484" y="476" class="s t2" font-size="14">cost · latency (no request text)</text><circle cx="898.5" cy="176.5" r="10.5" fill="#eff2f5"/><text x="898.5" y="181" class="s t" text-anchor="middle" font-size="13" font-weight="600">4</text><text x="918" y="182" class="m t" font-size="14">POST /v1/systemone</text><text x="918" y="206" class=