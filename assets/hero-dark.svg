<title id="referee-hero-title">claude-referee: evidence over eloquence</title>
<desc id="referee-hero-desc">The claude-referee mark, a pennant on a pole, and wordmark with the slogan &quot;Evidence over eloquence.&quot; and the line &quot;Claude makes the big calls. The referee makes the small ones.&quot; A terminal card labelled &quot;Stop hook, done-gate (v0.2)&quot; shows Claude saying &quot;All tests pass. Done.&quot;, the referee answering &quot;No passing check since your last edit. Run the check: cargo nextest run&quot;, and Claude replying &quot;Ran it: 2 failures. Fixing them&quot;. Footer: unofficial, built on TypeSafe Jev, MIT.</desc>
